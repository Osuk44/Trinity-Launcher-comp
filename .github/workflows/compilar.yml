name: Compilar Trinity Launcher

on:
  push:
    branches: [ main, master, appimage-rebase ]
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:12

    steps:
      - name: Instalar dependencias base del contenedor
        run: |
          apt-get update
          apt-get install -y sudo git curl ca-certificates

      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Actualizar submódulo del linker a la última versión
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --remote --recursive

      - name: Dar permisos de ejecución al script
        run: chmod +x build.sh

      - name: Instalar dependencias del sistema
        run: ./build.sh --deps

      - name: Compilar en modo Release
        run: ./build.sh --release

      - name: Subir binarios compilados (artefactos)
        uses: actions/upload-artifact@v4
        with:
          name: trinity-launcher-binarios
          path: |
            build/app/trinity
          if-no-files-found: warn
